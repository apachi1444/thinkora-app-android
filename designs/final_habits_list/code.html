<button class="w-10 h-10 flex items-center justify-center rounded-full text-emerald-700 dark:text-emerald-400 hover:bg-stone-100/50 dark:hover:bg-stone-800/50 transition-all duration-300 scale-95 active:scale-90 transition-transform">

</button>

<main class="pt-12 md:pt-28 pb-32 px-6 max-w-2xl mx-auto space-y-10">
<!-- Header Section -->
<section class="space-y-6 mt-8">
<h1 class="font-headline text-4xl lg:text-5xl font-light text-on-background tracking-tight">Your Habits</h1>
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-xl px-6 py-4 flex items-center justify-center gap-3 shadow-[0_12px_40px_rgba(47,104,84,0.15)] hover:opacity-90 transition-opacity duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-body text-lg font-medium tracking-wide">Increment all habits</span>
</button>
</section>
<!-- Habits List -->
<section class="flex flex-col gap-4">
<!-- Habit Card: Double Cleansing -->
<div class="bg-surface-container-lowest p-5 rounded-xl flex items-center justify-between ambient-shadow group hover:bg-surface-bright transition-colors duration-300">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
<div>
<h3 class="font-headline text-lg font-medium text-on-surface">Double Cleansing</h3>

<span class="material-symbols-outlined text-[16px] text-secondary-container" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>

</div>
</div>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-primary hover:text-on-primary transition-colors duration-300">

</button>
</div>

<span class="material-symbols-outlined text-[16px] text-secondary-container" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
                            45 day streak
                        </p>
</div>
</div>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-primary hover:text-on-primary transition-colors duration-300">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<!-- Habit Card: Hyaluronic Serum (Swipe-to-delete state) -->

<div class="absolute inset-y-0 right-0 w-full bg-error rounded-xl flex items-center justify-end px-6 text-on-error">
<span class="material-symbols-outlined text-2xl">delete</span>
</div>

<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">science</span>
</div>
<div>
<h3 class="font-headline text-lg font-medium text-on-surface">Hyaluronic Serum</h3>

<span class="material-symbols-outlined text-[16px] text-secondary-container" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
                                8 day streak
                            </p>
</div>
</div>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary pointer-events-none opacity-50">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>

<!-- Home -->

<span>Home</span>

<span class="material-symbols-outlined">analytics</span>
