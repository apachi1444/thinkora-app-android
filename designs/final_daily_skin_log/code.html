<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AuraSkin - Daily Skin Log</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface": "#fcf9f7",
                      "on-tertiary": "#ffffff",
                      "secondary-container": "#ffafa9",
                      "tertiary-fixed-dim": "#b7c7e7",
                      "on-error-container": "#93000a",
                      "primary-container": "#7eb8a0",
                      "tertiary": "#4f5f7b",
                      "on-secondary": "#ffffff",
                      "on-error": "#ffffff",
                      "surface-dim": "#dcd9d8",
                      "surface-tint": "#2f6854",
                      "on-secondary-fixed-variant": "#6e3633",
                      "on-tertiary-fixed": "#0a1c34",
                      "on-secondary-fixed": "#380c0b",
                      "on-primary-fixed-variant": "#13503d",
                      "tertiary-fixed": "#d6e3ff",
                      "on-tertiary-container": "#31415b",
                      "error-container": "#ffdad6",
                      "tertiary-container": "#9dadcc",
                      "inverse-primary": "#98d3ba",
                      "on-secondary-container": "#7a403c",
                      "outline-variant": "#bfc9c3",
                      "outline": "#707974",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-low": "#f6f3f1",
                      "on-primary-container": "#084937",
                      "surface-container-high": "#eae8e6",
                      "primary-fixed": "#b3efd5",
                      "surface-container": "#f0edeb",
                      "inverse-on-surface": "#f3f0ee",
                      "on-background": "#1b1c1b",
                      "on-surface": "#1b1c1b",
                      "surface-variant": "#e5e2e0",
                      "error": "#ba1a1a",
                      "on-primary": "#ffffff",
                      "background": "#fcf9f7",
                      "on-tertiary-fixed-variant": "#384762",
                      "surface-bright": "#fcf9f7",
                      "secondary-fixed": "#ffdad7",
                      "secondary": "#8b4d49",
                      "on-surface-variant": "#404944",
                      "on-primary-fixed": "#002116",
                      "primary": "#2f6854",
                      "inverse-surface": "#30302f",
                      "surface-container-highest": "#e5e2e0",
                      "primary-fixed-dim": "#98d3ba",
                      "secondary-fixed-dim": "#ffb3ad"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Manrope"
                      ],
                      "body": [
                              "Manrope"
                      ],
                      "label": [
                              "Manrope"
                      ]
              }
      },
          },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
        }
        /* Custom scrollbar for text area to keep it clean */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: theme('colors.surface-variant');
            border-radius: 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-stone-50/70 dark:bg-stone-900/70 backdrop-blur-xl font-manrope font-medium tracking-tight text-stone-800 dark:text-stone-100 fixed top-0 w-full z-50 shadow-[0_12px_40px_rgba(42,59,54,0.04)]">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden hover:bg-stone-100/50 dark:hover:bg-stone-800/50 transition-all duration-300 scale-95 active:scale-90 cursor-pointer flex items-center justify-center">
<!-- Fallback for avatar if no image -->
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
<h1 class="text-xl font-bold tracking-widest uppercase text-emerald-800 dark:text-emerald-200">AuraSkin</h1>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-emerald-700 dark:text-emerald-400 hover:bg-stone-100/50 dark:hover:bg-stone-800/50 transition-all duration-300 scale-95 active:scale-90">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="pt-28 pb-36 px-6 max-w-md mx-auto flex flex-col gap-10">
<!-- Page Title -->
<div class="flex flex-col gap-2">
<h2 class="font-headline text-3xl font-medium text-on-background tracking-tight">Daily Skin Log</h2>
<p class="font-body text-on-surface-variant">Document your journey, one day at a time.</p>
</div>
<!-- Progress Photo Section -->
<section class="flex flex-col gap-4">
<div class="aspect-square bg-surface-container-low rounded-[2rem] flex flex-col items-center justify-center gap-4 text-on-surface-variant hover:bg-surface-container transition-colors duration-300 cursor-pointer shadow-[0_8px_30px_rgba(42,59,54,0.03)] relative overflow-hidden group">
<!-- Ambient glow effect -->
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container-high/30 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<div class="w-16 h-16 rounded-full bg-surface flex items-center justify-center shadow-[0_4px_20px_rgba(42,59,54,0.05)] z-10">
<span class="material-symbols-outlined text-3xl text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</div>
<span class="font-label text-sm tracking-widest text-on-surface uppercase z-10">TAP TO CAPTURE</span>
</div>
</section>
<!-- Skin Condition Slider (Stepped Visual Representation) -->
<section class="flex flex-col gap-6 bg-surface-container-lowest p-6 rounded-[2rem] shadow-[0_12px_40px_rgba(42,59,54,0.02)]">
<h3 class="font-headline text-lg text-on-surface">Skin Condition</h3>
<div class="flex flex-col gap-4">
<div class="flex items-center justify-between w-full relative px-2">
<!-- Track -->
<div class="absolute left-4 right-4 h-1.5 bg-surface-container rounded-full top-1/2 -translate-y-1/2 z-0"></div>
<!-- Nodes (Simulated selected state on middle node) -->
<div class="w-5 h-5 rounded-full bg-surface-variant z-10 shadow-sm cursor-pointer hover:scale-110 transition-transform"></div>
<div class="w-5 h-5 rounded-full bg-surface-variant z-10 shadow-sm cursor-pointer hover:scale-110 transition-transform"></div>
<!-- Active Node -->
<div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-primary-container z-10 shadow-[0_4px_12px_rgba(47,104,84,0.2)] flex items-center justify-center cursor-pointer">
<div class="w-3 h-3 bg-on-primary rounded-full"></div>
</div>
<div class="w-5 h-5 rounded-full bg-surface-variant z-10 shadow-sm cursor-pointer hover:scale-110 transition-transform"></div>
<div class="w-5 h-5 rounded-full bg-surface-variant z-10 shadow-sm cursor-pointer hover:scale-110 transition-transform"></div>
</div>
<div class="flex justify-between w-full font-label text-xs text-on-surface-variant tracking-wider uppercase">
<span>Severe</span>
<span>Clear</span>
</div>
</div>
</section>
<!-- Daily Mood Selector -->
<section class="flex flex-col gap-6 bg-surface-container-lowest p-6 rounded-[2rem] shadow-[0_12px_40px_rgba(42,59,54,0.02)]">
<h3 class="font-headline text-lg text-on-surface">Daily Mood</h3>
<div class="flex justify-between items-center">
<!-- Mood Options -->
<button class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors duration-300">
<span class="material-symbols-outlined text-2xl">sentiment_very_dissatisfied</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors duration-300">
<span class="material-symbols-outlined text-2xl">sentiment_dissatisfied</span>
</button>
<!-- Active Mood -->
<button class="w-14 h-14 rounded-full bg-primary-container/20 flex items-center justify-center text-primary shadow-sm border border-primary/10 transition-colors duration-300 scale-110">
<span class="material-symbols-outlined text-3xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sentiment_neutral</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors duration-300">
<span class="material-symbols-outlined text-2xl">sentiment_satisfied</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors duration-300">
<span class="material-symbols-outlined text-2xl">sentiment_very_satisfied</span>
</button>
</div>
</section>
<!-- Contextual Notes -->
<section class="flex flex-col gap-4">
<label class="font-headline text-lg text-on-surface ml-2" for="notes">Contextual Notes</label>
<textarea class="w-full bg-surface-container-low rounded-3xl p-6 font-body text-on-surface placeholder-on-surface-variant/60 border-none outline-none focus:ring-0 resize-none h-40 transition-all duration-300 focus:bg-surface-container-lowest shadow-[inset_0_2px_10px_rgba(0,0,0,0.02)] focus:shadow-[0_8px_30px_rgba(42,59,54,0.04)]" id="notes" placeholder="How did your skin feel today? Any distinct triggers, new products, or stress factors?"></textarea>
</section>
<!-- Save Button -->
<div class="pt-4">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-5 rounded-[2rem] font-label font-bold tracking-[0.15em] text-sm shadow-[0_8px_30px_rgba(47,104,84,0.2)] hover:shadow-[0_12px_40px_rgba(47,104,84,0.25)] transition-all duration-300 flex items-center justify-center gap-2 hover:-translate-y-1">
                SAVE ENTRY
                <span class="material-symbols-outlined text-lg">check_circle</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-stone-50/80 dark:bg-stone-950/80 backdrop-blur-lg font-manrope text-[10px] font-semibold tracking-wider uppercase fixed bottom-0 w-full z-50 rounded-t-3xl shadow-[0_-8px_30px_rgba(42,59,54,0.03)] fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-2 pb-6 md:hidden">
<!-- Tab 1: Home -->
<a class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 hover:text-emerald-500 transition-colors duration-300 cubic-bezier(0.4,0,0.2,1) duration-300 py-2 w-16" href="#">
<span class="material-symbols-outlined mb-1">home_health</span>
<span class="truncate w-full text-center">Home</span>
</a>
<!-- Tab 2: Log (Active) -->
<a class="flex flex-col items-center justify-center text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-900/30 rounded-2xl px-3 py-1 hover:text-emerald-500 transition-colors duration-300 cubic-bezier(0.4,0,0.2,1) duration-300 w-16" href="#">
<span class="material-symbols-outlined mb-1" data-weight="fill" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<span class="truncate w-full text-center">Log</span>
</a>
<!-- Tab 3: Habits -->
<a class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 hover:text-emerald-500 transition-colors duration-300 cubic-bezier(0.4,0,0.2,1) duration-300 py-2 w-16" href="#">
<span class="material-symbols-outlined mb-1">auto_awesome_motion</span>
<span class="truncate w-full text-center">Habits</span>
</a>
<!-- Tab 4: Insights -->
<a class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 hover:text-emerald-500 transition-colors duration-300 cubic-bezier(0.4,0,0.2,1) duration-300 py-2 w-16" href="#">
<span class="material-symbols-outlined mb-1">analytics</span>
<span class="truncate w-full text-center">Insights</span>
</a>
<!-- Tab 5: Vault -->
<a class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 hover:text-emerald-500 transition-colors duration-300 cubic-bezier(0.4,0,0.2,1) duration-300 py-2 w-16" href="#">
<span class="material-symbols-outlined mb-1">auto_stories</span>
<span class="truncate w-full text-center">Vault</span>
</a>
</nav>
</body></html>
